[package]
name = "miniscript_wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly bindings around rust-miniscript for MiniCopilot"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
# NOTE: we intentionally keep the default `std` feature enabled (in addition to
# the `compiler` + `serde` features requested) because a large part of the
# miniscript API used below (Display, FromStr, script encoding, checksums)
# relies on `std`/`alloc`. Building with `default-features = false` breaks the
# wasm build. Everything else matches the spec.
miniscript = { version = "12.0", features = ["compiler", "serde"] }

# secp256k1 (re-exported by miniscript::bitcoin) is used only to derive
# deterministic *dummy* public keys so we can render real Script ASM and a
# valid descriptor checksum. No randomness is required, so no `getrandom` "js"
# shim is necessary for the wasm target.

[profile.release]
opt-level = "s"
lto = true
